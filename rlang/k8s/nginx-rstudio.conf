# /etc/nginx/sites-available/rstudio-3000.conf
# Plain HTTP: nginx listens on port 3000 and proxies to the RStudio NodePort.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:30787;
        proxy_redirect http://127.0.0.1:30787/ $scheme://$host:$server_port/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-RStudio-Request $scheme://$host:$server_port$request_uri;

        proxy_read_timeout 20d;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
